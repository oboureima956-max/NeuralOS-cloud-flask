name: NeuralOS Flask CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier app.py
        run: |
          python -m py_compile app.py

            - name: Vérifier Flask
        run: |
          python -c "import app; print('Fichier chargé:', app.__file__); print('Objet Flask:', app.app); print('NeuralOS Flask OK')"
